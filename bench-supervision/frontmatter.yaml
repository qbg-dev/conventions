name: bench-supervision
description: >
  Continuous monitoring and supervision of benchmark pipelines running on remote
  infrastructure. Covers: cron-driven health checks, pipeline restart/recovery,
  rate limit handling (model fallback + token rotation), progressive difficulty
  testing (sonnet → opus escalation), convergence detection, cost management,
  and fleet coordination. Read when operating a bench-supervisor agent, setting
  up benchmark monitoring cron jobs, or diagnosing stuck/dead pipelines.
type: convention
version: "1.0"
owner: warren
files:
  convention: CONVENTION.md
